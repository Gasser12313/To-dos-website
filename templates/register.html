{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  <form method="post" action="{{ url_for('register') }}" data-form="register" novalidate>
    <ul class="errors" {% if not errors %}hidden{% endif %}>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
    <label>Name <input type="text" name="name" value="{{ form.name or '' }}"></label>
    <label>Email <input type="email" name="email" value="{{ form.email or '' }}"></label>
    <label>Password <input type="password" name="password"></label>
    <label>Confirm password <input type="password" name="confirm_password"></label>
    <button class="btn block">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
